<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台登入 — Wedding Atelier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            background-image:
                linear-gradient(180deg, rgba(20, 27, 20, 0.62), rgba(20, 27, 20, 0.62)),
                url('assets/scene-hero.jpg');
            background-size: cover;
            background-position: center;
        }

        .login-card {
            width: min(400px, 100%);
            background: rgba(255, 253, 248, 0.94);
            backdrop-filter: blur(10px);
            border: 1px solid var(--line-strong);
            box-shadow: var(--shadow-soft);
            padding: 48px 40px;
            text-align: center;
        }

        .login-eyebrow {
            font-size: 11px;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: var(--clay);
            margin-bottom: 14px;
        }

        .login-card h1 { font-style: italic; font-size: 30px; margin-bottom: 30px; }

        .login-error {
            min-height: 18px;
            font-size: 13px;
            color: var(--clay-deep);
            margin-top: 14px;
        }
    </style>
</head>
<body>
    <div class="login-screen">
        <div class="login-card">
            <p class="login-eyebrow">Wedding Atelier</p>
            <h1>Admin Login</h1>

            <div class="field">
                <label>帳號</label>
                <input type="text" id="u" autocomplete="username">
            </div>
            <div class="field">
                <label>密碼</label>
                <input type="password" id="p" autocomplete="current-password">
            </div>

            <button onclick="doLogin()" class="btn-submit" type="button">登入後台 <span class="arrow">→</span></button>
            <p class="login-error" id="msg"></p>
        </div>
    </div>

    <div class="sound-toggle" id="soundToggle" role="button" tabindex="0" aria-label="播放或暫停背景音樂">
        <span class="sound-bars"><span></span><span></span><span></span></span>
        <span class="sound-toggle-label" id="soundLabel">Sound Off</span>
    </div>

    <audio id="bgAudio" src="assets/ambience.mp3" autoplay loop muted playsinline preload="auto"></audio>

    <script src="audio-consent.js"></script>
    <script>
        async function doLogin() {
            const msg = document.getElementById('msg');
            msg.textContent = '驗證中...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u.value, password: p.value })
                });
                const data = await res.json();

                if (res.ok && data.success) {
                    location.href = '/admin.html';
                } else {
                    msg.textContent = data.message || '登入失敗，請檢查帳號密碼';
                }
            } catch (err) {
                msg.textContent = '連線伺服器失敗';
            }
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doLogin();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const bgAudio = document.getElementById('bgAudio');
            const soundToggle = document.getElementById('soundToggle');
            const soundLabel = document.getElementById('soundLabel');
            window.AudioConsent?.attach({
                audio: bgAudio,
                toggle: soundToggle,
                onStateChange: (isPlaying) => {
                    if (soundLabel) soundLabel.textContent = isPlaying ? 'Sound On' : 'Sound Off';
                }
            });
        });
    </script>
</body>
</html>
